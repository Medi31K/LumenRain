name: Release

# Builds the installers and attaches them to a GitHub Release.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: 'Lumenrain v__VERSION__'
          releaseBody: |
            ## Download

            | System | File |
            |---|---|
            | **Windows** | `Lumenrain_x.y.z_x64-setup.exe` (recommended) or `.msi` |
            | **macOS** (Intel + Apple Silicon) | `Lumenrain_x.y.z_universal.dmg` |
            | **Linux** | `.AppImage`, `.deb` or `.rpm` |

            The installers aren't code-signed yet: on Windows click **More info → Run anyway**, on macOS right-click the app → **Open** the first time.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
